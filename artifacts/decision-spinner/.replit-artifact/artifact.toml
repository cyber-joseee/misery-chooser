kind = "web"
previewPath = "/"
title = "Quantum-Delphic Decision Spinner"
description = "An over-engineered comedy decision engine that subjects binary questions to a theatrical 30-second quantum, orbital, and telemetry calculation before delivering an utterly unhelpful verdict."
version = "1.0.0"
id = "artifacts/decision-spinner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24719

[services.development]
run = "pnpm --filter @workspace/decision-spinner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/decision-spinner", "run", "build" ]
serve = "static"
publicDir = "artifacts/decision-spinner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24719"
BASE_PATH = "/"
